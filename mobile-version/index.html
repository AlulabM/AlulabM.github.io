<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor de Património — Versão Mobile</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent-green: #10b981;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
            padding: 16px;
        }

        .container {
            max-width: 1320px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-title i {
            color: var(--primary);
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        .logo-title h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-success { background-color: var(--accent-green); color: white; }
        .btn-success:hover { background-color: #059669; }

        .btn-analytics { background-color: #8b5cf6; color: white; }
        .btn-analytics:hover { background-color: #7c3aed; }

        .btn-outline { background-color: transparent; border-color: var(--border); color: var(--text-main); }
        .btn-outline:hover { background-color: #f1f5f9; }

        /* Presets Bar / Categories (Scrollable on Mobile) */
        .presets-bar {
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .preset-buttons { 
            display: flex; 
            gap: 8px; 
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .preset-buttons::-webkit-scrollbar {
            height: 4px;
        }
        .preset-buttons::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .preset-chip {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg-main);
            color: var(--text-main);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .preset-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Controls */
        .controls { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }

        .search-box { position: relative; flex: 1; }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 42px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 16px; /* Evita zoom automático no iOS */
            outline: none;
            background: var(--card-bg);
        }

        /* Content Layout */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Gallery / Carousel in Card */
        .card-img-container {
            height: 180px;
            width: 100%;
            background-color: #f1f5f9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-img-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }
        .card-img-prev { left: 8px; }
        .card-img-next { right: 8px; }

        .img-counter-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(15, 23, 42, 0.75);
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
        .card-header-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .card-category { font-size: 0.7rem; text-transform: uppercase; color: var(--primary); font-weight: 700; }
        
        .badge-liq { font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
        .liq-alta { background: #d1fae5; color: #065f46; }
        .liq-media { background: #fef3c7; color: #92400e; }
        .liq-baixa { background: #fee2e2; color: #991b1b; }

        .card-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 8px; }
        .card-details { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; flex: 1; }
        .card-details p { margin-bottom: 4px; display: flex; justify-content: space-between; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border); }
        .price-container { display: flex; flex-direction: column; }
        .card-price { font-size: 1.1rem; font-weight: 700; color: var(--accent-green); }
        .card-unit-price { font-size: 0.75rem; color: var(--text-muted); }
        .card-actions { display: flex; gap: 6px; }

        .btn-icon {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon.delete-btn:hover { background: #fee2e2; color: var(--danger); }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1000;
            padding: 12px;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            width: 100%; max-width: 650px; max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .close-modal { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: var(--text-muted); padding: 0 8px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 16px; /* Evita zoom em dispositivos móveis */
        }
        .form-row, .form-row-3 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-row-3 { grid-template-columns: 1fr 1fr 1fr; }

        .attributes-section { background: var(--bg-main); padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 14px; }
        .attr-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .attr-row input { flex: 1; font-size: 16px; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 16px; color: var(--text-muted); }
        #fileInput { display: none; }

        /* Multiple Image Upload & Preview */
        .images-upload-container {
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .img-input-methods { display: flex; gap: 8px; flex-direction: column; }
        .url-input-group { display: flex; gap: 6px; }

        .images-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 8px;
            margin-top: 4px;
        }

        .img-preview-thumb {
            position: relative;
            width: 100%;
            height: 65px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #e2e8f0;
        }

        .img-preview-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .img-preview-remove {
            position: absolute;
            top: 2px; right: 2px;
            background: rgba(239, 68, 68, 0.9);
            color: white; border: none; border-radius: 50%;
            width: 22px; height: 22px;
            font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Analytics Styles */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-main); padding: 14px; border-radius: var(--radius); border: 1px solid var(--border); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .stat-value { font-size: 1.3rem; font-weight: 700; color: var(--primary); margin-top: 4px; }
        
        .analysis-section { margin-bottom: 20px; }
        .analysis-section h3 { font-size: 0.95rem; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        
        .progress-list { display: flex; flex-direction: column; gap: 10px; }
        .progress-item { display: flex; flex-direction: column; gap: 4px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; }
        .progress-bg { background: var(--border); height: 8px; border-radius: 999px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }

        .fill-primary { background: var(--primary); }
        .fill-green { background: var(--accent-green); }
        .fill-yellow { background: #f59e0b; }
        .fill-red { background: var(--danger); }

        /* --- REGRAS MÓVEIS (RESPONSIVIDADE) --- */
        @media (max-width: 768px) {
            body { padding: 10px; }

            header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 14px;
            }

            .logo-title {
                justify-content: center;
            }

            .actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }

            .actions .btn {
                font-size: 0.78rem;
                padding: 8px 6px;
            }

            .form-row, .form-row-3 {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .modal {
                padding: 16px;
                max-height: 94vh;
            }

            .attr-row {
                flex-direction: row;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-title">
                <i data-lucide="landmark"></i>
                <div>
                    <h1>Gestor de Património</h1>
                    <p style="font-size: 0.75rem; color: var(--text-muted);">Imóveis, Veículos, Ativos e Outros</p>
                </div>
            </div>
            <div class="actions">
                <button id="btn-login" class="btn btn-primary" onclick="loginGoogle()">
                    <i data-lucide="log-in" style="width: 16px;"></i> Entrar
                </button>
                <button id="btn-logout" class="btn btn-outline" onclick="logoutGoogle()" style="display: none;">
                    <i data-lucide="log-out" style="width: 16px;"></i> Sair
                </button>
                <button class="btn btn-analytics" onclick="openAnalyticsModal()">
                    <i data-lucide="pie-chart" style="width: 16px;"></i> Análise
                </button>
                <button class="btn btn-outline" onclick="triggerImport()">
                    <i data-lucide="upload" style="width: 16px;"></i> Importar
                </button>
                <button class="btn btn-outline" onclick="exportXML()">
                    <i data-lucide="download" style="width: 16px;"></i> XML
                </button>
                <button class="btn btn-success" onclick="exportCSV()">
                    <i data-lucide="file-spreadsheet" style="width: 16px;"></i> CSV
                </button>
                <button class="btn btn-primary" style="grid-column: span 2;" onclick="openModal()">
                    <i data-lucide="plus" style="width: 16px;"></i> Novo Item
                </button>
                <input type="file" id="fileInput" accept=".xml" onchange="importXML(event)">
            </div>
        </header>

        <div class="presets-bar">
            <span style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">Categorias (Deslize &rarr;):</span>
            <div class="preset-buttons" id="categoryFilters">
                <button class="preset-chip active" onclick="filterCategory('all')">Todos</button>
                <button class="preset-chip" onclick="filterCategory('Imóveis Urbanos')"><i data-lucide="building" style="width: 14px;"></i> Urbanos</button>
                <button class="preset-chip" onclick="filterCategory('Imóveis Rústicos')"><i data-lucide="trees" style="width: 14px;"></i> Rústicos</button>
                <button class="preset-chip" onclick="filterCategory('Máquinas')"><i data-lucide="cog" style="width: 14px;"></i> Máquinas</button>
                <button class="preset-chip" onclick="filterCategory('Móveis')"><i data-lucide="armchair" style="width: 14px;"></i> Móveis</button>
                <button class="preset-chip" onclick="filterCategory('Automóveis')"><i data-lucide="car" style="width: 14px;"></i> Automóveis</button>
                <button class="preset-chip" onclick="filterCategory('Moedas')"><i data-lucide="coins" style="width: 14px;"></i> Moedas</button>
                <button class="preset-chip" onclick="filterCategory('Joias e metais preciosos')"><i data-lucide="gem" style="width: 14px;"></i> Joias</button>
                <button class="preset-chip" onclick="filterCategory('Ativos financeiros')"><i data-lucide="trending-up" style="width: 14px;"></i> Finanças</button>
                <button class="preset-chip" onclick="filterCategory('Outros')"><i data-lucide="box" style="width: 14px;"></i> Outros</button>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar património..." oninput="renderItems()">
            </div>
        </div>

        <div class="content-grid" id="catalogGrid"></div>
    </div>

    <!-- Modal Form (Adicionar/Editar Item) -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle" style="font-size: 1.1rem;">Adicionar Item</h2>
                <button class="close-modal" type="button" onclick="closeModal()">&times;</button>
            </div>
            <form id="itemForm" onsubmit="saveItem(event)">
                <input type="hidden" id="itemId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="itemTitle">Título / Nome *</label>
                        <input type="text" id="itemTitle" required placeholder="Ex: T2 no Centro / Carro">
                    </div>
                    <div class="form-group">
                        <label for="itemCategory">Categoria *</label>
                        <select id="itemCategory" onchange="handleCategoryChange()" required>
                            <option value="Imóveis Urbanos">Imóveis Urbanos</option>
                            <option value="Imóveis Rústicos">Imóveis Rústicos</option>
                            <option value="Máquinas">Máquinas</option>
                            <option value="Móveis">Móveis</option>
                            <option value="Automóveis">Automóveis</option>
                            <option value="Moedas">Moedas</option>
                            <option value="Joias e metais preciosos">Joias e metais preciosos</option>
                            <option value="Ativos financeiros">Ativos financeiros</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                </div>

                <div class="form-row-3">
                    <div class="form-group">
                        <label for="itemPrice">Preço (€) *</label>
                        <input type="number" step="0.01" id="itemPrice" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="itemQuantity">Qtd. *</label>
                        <input type="number" step="1" min="1" id="itemQuantity" value="1" required>
                    </div>
                    <div class="form-group">
                        <label for="itemLiquidity">Liquidez *</label>
                        <select id="itemLiquidity" required>
                            <option value="Alta">Alta</option>
                            <option value="Média">Média</option>
                            <option value="Baixa">Baixa</option>
                        </select>
                    </div>
                </div>

                <!-- Gestão de Múltiplas Fotos -->
                <div class="form-group">
                    <label>Fotos (Múltiplas)</label>
                    <div class="images-upload-container">
                        <div class="img-input-methods">
                            <input type="file" id="itemLocalImages" accept="image/*" multiple onchange="handleMultipleFiles(event)" style="display: none;">
                            <button type="button" class="btn btn-outline" style="width: 100%;" onclick="document.getElementById('itemLocalImages').click()">
                                <i data-lucide="image-plus" style="width: 16px;"></i> Tirar Foto / Galeria
                            </button>
                            <div class="url-input-group">
                                <input type="url" id="itemImageUrlInput" placeholder="https://link-da-imagem.com/foto.jpg">
                                <button type="button" class="btn btn-outline" onclick="addUrlImage()">+ URL</button>
                            </div>
                        </div>
                        <div class="images-preview-grid" id="imagesPreviewContainer"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="itemDescription">Descrição / Notas</label>
                    <textarea id="itemDescription" rows="2" placeholder="Notas adicionais..."></textarea>
                </div>

                <div class="attributes-section">
                    <h4 style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem;">
                        Atributos da Categoria
                        <button type="button" class="btn btn-outline" style="padding: 2px 6px; font-size: 0.75rem;" onclick="addAttrRow()">+ Campo</button>
                    </h4>
                    <div id="attributesContainer"></div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveSubmit">Salvar Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Análise Financeira -->
    <div class="modal-overlay" id="analyticsModal">
        <div class="modal">
            <div class="modal-header">
                <h2 style="font-size: 1.1rem;">Análise Financeira</h2>
                <button class="close-modal" type="button" onclick="closeAnalyticsModal()">&times;</button>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Património Total</div>
                    <div class="stat-value" id="statTotalValue">€ 0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total de Itens</div>
                    <div class="stat-value" id="statTotalItems">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Liquidez Alta</div>
                    <div class="stat-value" style="color: var(--accent-green);" id="statHighLiquidity">€ 0.00</div>
                </div>
            </div>

            <div class="analysis-section">
                <h3><i data-lucide="pie-chart" style="width: 16px;"></i> Por Categoria</h3>
                <div class="progress-list" id="categoryAnalyticsList"></div>
            </div>

            <div class="analysis-section">
                <h3><i data-lucide="droplet" style="width: 16px;"></i> Por Liquidez</h3>
                <div class="progress-list" id="liquidityAnalyticsList"></div>
            </div>

            <div style="display: flex; justify-content: flex-end; margin-top: 16px;">
                <button type="button" class="btn btn-outline" onclick="closeAnalyticsModal()">Fechar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            deleteDoc, 
            onSnapshot, 
            collection 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZJLq_lahgFfIdUZM1ieVumLsP50taeZo",
            authDomain: "meu-inventario-5b10b.firebaseapp.com",
            projectId: "meu-inventario-5b10b",
            storageBucket: "meu-inventario-5b10b.firebasestorage.app",
            messagingSenderId: "531832101508",
            appId: "1:531832101508:web:a6b619931d3fbf530980d1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let catalog = [];
        let currentUser = null;
        let unsubscribeListener = null;

        let selectedCategory = 'all';
        let currentModalImages = [];
        let cardImageIndexes = {};

        const categoryPresets = {
            'Imóveis Urbanos': ['Tipologia', 'Área Útil (m²)', 'Localização'],
            'Imóveis Rústicos': ['Área (ha/m²)', 'Tipo Terreno', 'Localização'],
            'Máquinas': ['Marca/Modelo', 'Ano', 'N.º Série'],
            'Móveis': ['Material', 'Estado'],
            'Automóveis': ['Marca/Modelo', 'Ano', 'Km', 'Matrícula'],
            'Moedas': ['Valor Facial', 'Ano', 'Metal'],
            'Joias e metais preciosos': ['Metal', 'Pureza', 'Peso (g)'],
            'Ativos financeiros': ['Tipo Ativo', 'Instituição', 'Rentabilidade'],
            'Outros': ['Estado', 'Origem']
        };

        const categoryDefaultLiquidity = {
            'Imóveis Urbanos': 'Baixa',
            'Imóveis Rústicos': 'Baixa',
            'Máquinas': 'Média',
            'Móveis': 'Média',
            'Automóveis': 'Média',
            'Moedas': 'Média',
            'Joias e metais preciosos': 'Alta',
            'Ativos financeiros': 'Alta',
            'Outros': 'Média'
        };

        function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const btnLogin = document.getElementById('btn-login');
            const btnLogout = document.getElementById('btn-logout');

            if (user) {
                if (btnLogin) btnLogin.style.display = 'none';
                if (btnLogout) btnLogout.style.display = 'inline-flex';

                const userItemsRef = collection(db, "usuarios", user.uid, "itens");
                if (unsubscribeListener) unsubscribeListener();

                unsubscribeListener = onSnapshot(userItemsRef, (snapshot) => {
                    catalog = snapshot.docs.map(doc => doc.data());
                    renderItems();
                }, (err) => console.error("Firestore:", err));
            } else {
                if (btnLogin) btnLogin.style.display = 'inline-flex';
                if (btnLogout) btnLogout.style.display = 'none';
                catalog = [];
                if (unsubscribeListener) unsubscribeListener();
                renderItems();
            }
        });

        window.loginGoogle = async () => {
            try {
                await setPersistence(auth, browserLocalPersistence);
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                await signInWithPopup(auth, provider);
            } catch (err) {
                alert("Erro ao entrar: " + err.message);
            }
        };

        window.logoutGoogle = () => signOut(auth);

        window.filterCategory = function(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.preset-chip').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(cat) || (cat === 'all' && btn.textContent.includes('Todos')));
            });
            renderItems();
        };

        window.renderItems = function() {
            const grid = document.getElementById('catalogGrid');
            if (!grid) return;

            const searchInput = document.getElementById('searchInput');
            const search = searchInput ? searchInput.value.toLowerCase() : '';

            if (!currentUser) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>Sessão não iniciada</h3>
                        <p>Inicie sessão com o Google para carregar os seus dados.</p>
                    </div>
                `;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            const filtered = catalog.filter(item => {
                const matchesCat = selectedCategory === 'all' || item.category === selectedCategory;
                const matchesSearch = (item.title && item.title.toLowerCase().includes(search)) ||
                                      (item.category && item.category.toLowerCase().includes(search)) ||
                                      (item.description && item.description.toLowerCase().includes(search)) ||
                                      Object.entries(item.attrs || {}).some(([k, v]) => 
                                          k.toLowerCase().includes(search) || String(v).toLowerCase().includes(search)
                                      );
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>Sem itens</h3>
                        <p>Nenhum registo encontrado.</p>
                    </div>
                `;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            grid.innerHTML = filtered.map(item => {
                let itemImages = item.images || [];
                if (itemImages.length === 0 && item.image) itemImages = [item.image];

                const currentImgIdx = cardImageIndexes[item.id] || 0;
                const imgUrl = itemImages[currentImgIdx] || 'https://via.placeholder.com/400x300?text=Sem+Imagem';
                
                const quantity = parseInt(item.quantity) || 1;
                const unitPrice = parseFloat(item.price) || 0;
                const totalPrice = unitPrice * quantity;

                const liqClass = item.liquidity === 'Alta' ? 'liq-alta' : item.liquidity === 'Média' ? 'liq-media' : 'liq-baixa';

                const attrsHtml = Object.entries(item.attrs || {})
                    .slice(0, 3)
                    .map(([key, val]) => `<p><span>${escapeHtml(key)}:</span> <strong>${escapeHtml(val)}</strong></p>`)
                    .join('');

                const safeId = String(item.id).replace(/'/g, "\\'");

                let navBtnsHtml = '';
                let counterBadgeHtml = '';
                if (itemImages.length > 1) {
                    navBtnsHtml = `
                        <button class="card-img-nav card-img-prev" type="button" onclick="navigateCardImage('${safeId}', -1, event)">&lt;</button>
                        <button class="card-img-nav card-img-next" type="button" onclick="navigateCardImage('${safeId}', 1, event)">&gt;</button>
                    `;
                    counterBadgeHtml = `<span class="img-counter-badge">${currentImgIdx + 1}/${itemImages.length}</span>`;
                }

                return `
                    <div class="item-card">
                        <div class="card-img-container">
                            ${navBtnsHtml}
                            <img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(item.title)}" class="card-img" onerror="this.src='https://via.placeholder.com/400x300?text=Sem+Imagem'">
                            ${counterBadgeHtml}
                        </div>
                        <div class="card-body">
                            <div class="card-header-meta">
                                <span class="card-category">${escapeHtml(item.category)}</span>
                                <span class="badge-liq ${liqClass}">${escapeHtml(item.liquidity || 'Média')}</span>
                            </div>
                            <h3 class="card-title">${escapeHtml(item.title)}</h3>
                            <div class="card-details">
                                <p><span>Qtd:</span> <strong>${quantity}</strong></p>
                                ${attrsHtml}
                            </div>
                            <div class="card-footer">
                                <div class="price-container">
                                    <span class="card-price">€ ${totalPrice.toLocaleString('pt-PT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                                    ${quantity > 1 ? `<span class="card-unit-price">€ ${unitPrice.toLocaleString('pt-PT', {minimumFractionDigits: 2})} / un</span>` : ''}
                                </div>
                                <div class="card-actions">
                                    <button class="btn-icon" type="button" onclick="editItem('${safeId}')"><i data-lucide="edit-2" style="width: 16px;"></i></button>
                                    <button class="btn-icon delete-btn" type="button" onclick="deleteItem('${safeId}')"><i data-lucide="trash-2" style="width: 16px;"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (typeof lucide !== 'undefined') lucide.createIcons();
        };

        window.navigateCardImage = function(itemId, direction, event) {
            if (event) event.stopPropagation();
            const item = catalog.find(i => String(i.id) === String(itemId));
            if (!item) return;

            let imgs = item.images || [];
            if (imgs.length === 0 && item.image) imgs = [item.image];
            if (imgs.length <= 1) return;

            let currentIdx = cardImageIndexes[itemId] || 0;
            currentIdx += direction;

            if (currentIdx < 0) currentIdx = imgs.length - 1;
            if (currentIdx >= imgs.length) currentIdx = 0;

            cardImageIndexes[itemId] = currentIdx;
            renderItems();
        };

        window.handleMultipleFiles = async function(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;

            for (let file of files) {
                try {
                    const compressed = await compressImage(file);
                    currentModalImages.push(compressed);
                } catch (err) {
                    console.error("Compressão:", err);
                }
            }
            event.target.value = '';
            renderImagesPreview();
        };

        window.addUrlImage = function() {
            const input = document.getElementById('itemImageUrlInput');
            const url = input.value.trim();
            if (url) {
                currentModalImages.push(url);
                input.value = '';
                renderImagesPreview();
            }
        };

        window.removeModalImage = function(index) {
            currentModalImages.splice(index, 1);
            renderImagesPreview();
        };

        function renderImagesPreview() {
            const container = document.getElementById('imagesPreviewContainer');
            if (!container) return;

            if (currentModalImages.length === 0) {
                container.innerHTML = '<span style="font-size: 0.75rem; color: var(--text-muted); grid-column: 1/-1;">Sem fotos.</span>';
                return;
            }

            container.innerHTML = currentModalImages.map((src, idx) => `
                <div class="img-preview-thumb">
                    <img src="${escapeHtml(src)}" alt="Thumb ${idx + 1}" onerror="this.src='https://via.placeholder.com/100?text=Erro'">
                    <button type="button" class="img-preview-remove" onclick="removeModalImage(${idx})">&times;</button>
                </div>
            `).join('');
        }

        window.openModal = function(editId = null) {
            const modal = document.getElementById('itemModal');
            const form = document.getElementById('itemForm');
            form.reset();
            document.getElementById('attributesContainer').innerHTML = '';
            currentModalImages = [];

            if (editId) {
                const item = catalog.find(i => String(i.id) === String(editId));
                if (item) {
                    document.getElementById('modalTitle').textContent = 'Editar Item';
                    document.getElementById('itemId').value = item.id;
                    document.getElementById('itemTitle').value = item.title;
                    document.getElementById('itemCategory').value = item.category;
                    document.getElementById('itemPrice').value = item.price || '';
                    document.getElementById('itemQuantity').value = item.quantity || 1;
                    document.getElementById('itemLiquidity').value = item.liquidity || 'Média';
                    document.getElementById('itemDescription').value = item.description || '';

                    if (item.images && item.images.length > 0) {
                        currentModalImages = [...item.images];
                    } else if (item.image) {
                        currentModalImages = [item.image];
                    }

                    Object.entries(item.attrs || {}).forEach(([k, v]) => addAttrRow(k, v));
                }
            } else {
                document.getElementById('modalTitle').textContent = 'Novo Item';
                document.getElementById('itemId').value = '';
                handleCategoryChange();
            }

            renderImagesPreview();
            modal.classList.add('active');
        };

        window.closeModal = function() {
            document.getElementById('itemModal').classList.remove('active');
        };

        window.handleCategoryChange = function() {
            const cat = document.getElementById('itemCategory').value;
            
            if (!document.getElementById('itemId').value) {
                if (categoryDefaultLiquidity[cat]) {
                    document.getElementById('itemLiquidity').value = categoryDefaultLiquidity[cat];
                }

                const container = document.getElementById('attributesContainer');
                container.innerHTML = '';
                (categoryPresets[cat] || []).forEach(attrName => addAttrRow(attrName, ''));
            }
        };

        window.addAttrRow = function(key = '', val = '') {
            const container = document.getElementById('attributesContainer');
            const row = document.createElement('div');
            row.className = 'attr-row';
            row.innerHTML = `
                <input type="text" placeholder="Campo" class="attr-key" value="${escapeHtml(key)}">
                <input type="text" placeholder="Valor" class="attr-value" value="${escapeHtml(val)}">
                <button type="button" class="btn-icon delete-btn" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(row);
        };

        window.saveItem = async function(e) {
            e.preventDefault();
            if (!currentUser) return;

            const btnSave = document.getElementById('btnSaveSubmit');
            btnSave.disabled = true;
            btnSave.textContent = 'A guardar...';

            try {
                const id = document.getElementById('itemId').value || Date.now().toString();
                const title = document.getElementById('itemTitle').value;
                const category = document.getElementById('itemCategory').value;
                const price = parseFloat(document.getElementById('itemPrice').value) || 0;
                const quantity = parseInt(document.getElementById('itemQuantity').value) || 1;
                const liquidity = document.getElementById('itemLiquidity').value || 'Média';
                const description = document.getElementById('itemDescription').value || '';

                const images = [...currentModalImages];
                const primaryImage = images[0] || '';

                const attrs = {};
                const keys = document.querySelectorAll('.attr-key');
                const vals = document.querySelectorAll('.attr-value');
                keys.forEach((kInput, index) => {
                    const k = kInput.value.trim();
                    const v = vals[index].value.trim();
                    if (k) attrs[k] = v;
                });

                const newItem = { 
                    id, 
                    title, 
                    category, 
                    price, 
                    quantity, 
                    liquidity, 
                    images, 
                    image: primaryImage,
                    description, 
                    attrs 
                };

                const docRef = doc(db, "usuarios", currentUser.uid, "itens", String(id));
                await setDoc(docRef, newItem);

                selectedCategory = 'all';
                const searchInput = document.getElementById('searchInput');
                if (searchInput) searchInput.value = '';

                const existingIdx = catalog.findIndex(i => String(i.id) === String(id));
                if (existingIdx >= 0) catalog[existingIdx] = newItem;
                else catalog.push(newItem);

                renderItems();
                closeModal();
            } catch (err) {
                alert("Erro ao guardar: " + err.message);
            } finally {
                btnSave.disabled = false;
                btnSave.textContent = 'Salvar Item';
            }
        };

        window.editItem = function(id) { openModal(id); };

        window.deleteItem = async function(id) {
            if (!currentUser) return;
            if (confirm('Eliminar este item?')) {
                try {
                    const docRef = doc(db, "usuarios", currentUser.uid, "itens", String(id));
                    await deleteDoc(docRef);
                } catch (err) {
                    alert("Erro ao eliminar: " + err.message);
                }
            }
        };

        window.openAnalyticsModal = function() {
            const modal = document.getElementById('analyticsModal');
            let totalPortfolioValue = 0;
            let totalItemsCount = 0;
            const categoryTotals = {};
            const categoryCounts = {};
            const liquidityTotals = { 'Alta': 0, 'Média': 0, 'Baixa': 0 };

            catalog.forEach(item => {
                const qty = parseInt(item.quantity) || 1;
                const price = parseFloat(item.price) || 0;
                const itemTotal = price * qty;

                totalPortfolioValue += itemTotal;
                totalItemsCount += qty;

                categoryTotals[item.category] = (categoryTotals[item.category] || 0) + itemTotal;
                categoryCounts[item.category] = (categoryCounts[item.category] || 0) + qty;

                const liq = item.liquidity || 'Média';
                liquidityTotals[liq] = (liquidityTotals[liq] || 0) + itemTotal;
            });

            document.getElementById('statTotalValue').textContent = `€ ${totalPortfolioValue.toLocaleString('pt-PT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('statTotalItems').textContent = totalItemsCount;
            document.getElementById('statHighLiquidity').textContent = `€ ${liquidityTotals['Alta'].toLocaleString('pt-PT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

            const catContainer = document.getElementById('categoryAnalyticsList');
            const categories = Object.keys(categoryPresets);
            
            catContainer.innerHTML = categories.map(cat => {
                const val = categoryTotals[cat] || 0;
                const qty = categoryCounts[cat] || 0;
                const pct = totalPortfolioValue > 0 ? ((val / totalPortfolioValue) * 100).toFixed(1) : 0;

                return `
                    <div class="progress-item">
                        <div class="progress-info">
                            <span>${cat} (${qty})</span>
                            <span>€ ${val.toLocaleString('pt-PT', {minimumFractionDigits: 2})} — <strong>${pct}%</strong></span>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill fill-primary" style="width: ${pct}%;"></div>
                        </div>
                    </div>
                `;
            }).join('');

            const liqContainer = document.getElementById('liquidityAnalyticsList');
            const liqLevels = [
                { key: 'Alta', label: 'Alta (Cash/Ações/Metais)', fillClass: 'fill-green' },
                { key: 'Média', label: 'Média (Veículos/Móveis)', fillClass: 'fill-yellow' },
                { key: 'Baixa', label: 'Baixa (Imóveis/Terrenos)', fillClass: 'fill-red' }
            ];

            liqContainer.innerHTML = liqLevels.map(l => {
                const val = liquidityTotals[l.key] || 0;
                const pct = totalPortfolioValue > 0 ? ((val / totalPortfolioValue) * 100).toFixed(1) : 0;

                return `
                    <div class="progress-item">
                        <div class="progress-info">
                            <span>${l.label}</span>
                            <span>€ ${val.toLocaleString('pt-PT', {minimumFractionDigits: 2})} — <strong>${pct}%</strong></span>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill ${l.fillClass}" style="width: ${pct}%;"></div>
                        </div>
                    </div>
                `;
            }).join('');

            modal.classList.add('active');
            if (typeof lucide !== 'undefined') lucide.createIcons();
        };

        window.closeAnalyticsModal = function() {
            document.getElementById('analyticsModal').classList.remove('active');
        };

        window.exportXML = function() {
            let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<patrimonio>\n';
            catalog.forEach(item => {
                let imgs = item.images || [];
                if (imgs.length === 0 && item.image) imgs = [item.image];

                xml += '  <item>\n';
                xml += `    <id>${escapeXml(item.id)}</id>\n`;
                xml += `    <titulo>${escapeXml(item.title)}</titulo>\n`;
                xml += `    <categoria>${escapeXml(item.category)}</categoria>\n`;
                xml += `    <preco>${item.price}</preco>\n`;
                xml += `    <quantidade>${item.quantity || 1}</quantidade>\n`;
                xml += `    <liquidez>${escapeXml(item.liquidity || 'Média')}</liquidez>\n`;
                xml += `    <descricao>${escapeXml(item.description)}</descricao>\n`;
                xml += '  </item>\n';
            });
            xml += '</patrimonio>';

            downloadFile(xml, 'patrimonio.xml', 'application/xml');
        };

        window.exportCSV = function() {
            let headers = ['ID', 'Título', 'Categoria', 'Preço Unitário', 'Quantidade', 'Valor Total', 'Liquidez'];
            let csvRows = [headers.join(';')];

            catalog.forEach(item => {
                const qty = parseInt(item.quantity) || 1;
                const price = parseFloat(item.price) || 0;
                let row = [item.id, item.title, item.category, price, qty, price * qty, item.liquidity || 'Média'];
                csvRows.push(row.map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(';'));
            });

            downloadFile('\uFEFF' + csvRows.join('\n'), 'patrimonio.csv', 'text/csv;charset=utf-8;');
        };

        window.triggerImport = function() { document.getElementById('fileInput').click(); };

        window.importXML = function(event) {
            if (!currentUser) return;
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(e.target.result, "text/xml");
                    const items = xmlDoc.getElementsByTagName("item");

                    for (let i = 0; i < items.length; i++) {
                        const el = items[i];
                        const id = getXmlText(el, "id") || Date.now().toString() + i;
                        const title = getXmlText(el, "titulo") || 'Sem Título';
                        const category = getXmlText(el, "categoria") || 'Outros';
                        const price = parseFloat(getXmlText(el, "preco")) || 0;
                        const quantity = parseInt(getXmlText(el, "quantidade")) || 1;

                        const importedItem = { id, title, category, price, quantity, liquidity: 'Média', images: [], image: '', description: '', attrs: {} };
                        const docRef = doc(db, "usuarios", currentUser.uid, "itens", String(id));
                        await setDoc(docRef, importedItem);
                    }
                    alert(`${items.length} itens importados!`);
                } catch (err) {
                    alert('Erro ao importar XML.');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        };

        function getXmlText(parent, tagName) {
            const node = parent.getElementsByTagName(tagName)[0];
            return node ? node.textContent : '';
        }

        function escapeXml(str) {
            return String(str || '').replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]));
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
</body>
