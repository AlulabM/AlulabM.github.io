<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Património — Versão PC</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent-green: #10b981;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.5; padding: 24px; }
        .container { max-width: 1400px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 20px 24px; border-radius: var(--radius);
            box-shadow: var(--shadow); margin-bottom: 24px; border: 1px solid var(--border);
        }

        .logo-title { display: flex; align-items: center; gap: 14px; }
        .logo-title i { color: var(--primary); width: 32px; height: 32px; }
        .logo-title h1 { font-size: 1.5rem; font-weight: 700; }

        .actions { display: flex; gap: 10px; align-items: center; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 16px; font-size: 0.9rem; font-weight: 600; border-radius: 8px;
            border: 1px solid transparent; cursor: pointer; transition: all 0.2s ease;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-outline { background-color: transparent; border-color: var(--border); color: var(--text-main); }
        .btn-outline:hover { background-color: #f1f5f9; }

        .presets-bar {
            background: var(--card-bg); padding: 14px 20px; border-radius: var(--radius);
            box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
        }
        .preset-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .preset-chip {
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
            background: var(--bg-main); color: var(--text-main); font-size: 0.85rem;
            font-weight: 500; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .preset-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        .controls { display: flex; gap: 16px; margin-bottom: 24px; }
        .search-box { position: relative; flex: 1; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 20px; height: 20px; }
        .search-box input {
            width: 100%; padding: 12px 16px 12px 44px; border-radius: 8px;
            border: 1px solid var(--border); font-size: 0.95rem; outline: none; background: var(--card-bg);
        }

        .content-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;
        }

        .item-card {
            background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border);
            box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .item-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }

        .card-img-container {
            height: 200px; width: 100%; background-color: #f1f5f9; overflow: hidden;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-img-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.6); color: white; border: none;
            border-radius: 50%; width: 32px; height: 32px; display: flex;
            align-items: center; justify-content: center; cursor: pointer; z-index: 5;
        }
        .card-img-prev { left: 8px; }
        .card-img-next { right: 8px; }
        .img-counter-badge {
            position: absolute; bottom: 8px; right: 8px; background: rgba(15, 23, 42, 0.75);
            color: white; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; font-weight: 600;
        }

        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .card-header-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .card-category { font-size: 0.75rem; text-transform: uppercase; color: var(--primary); font-weight: 700; }
        .badge-liq { font-size: 0.75rem; padding: 2px 10px; border-radius: 12px; font-weight: 600; }
        .liq-alta { background: #d1fae5; color: #065f46; }
        .liq-media { background: #fef3c7; color: #92400e; }
        .liq-baixa { background: #fee2e2; color: #991b1b; }

        .card-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; }
        .card-details { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; flex: 1; }
        .card-details p { margin-bottom: 4px; display: flex; justify-content: space-between; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border); }
        .card-price { font-size: 1.25rem; font-weight: 700; color: var(--accent-green); }
        .card-actions { display: flex; gap: 6px; }

        .btn-icon {
            padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: transparent;
            cursor: pointer; color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .btn-icon:hover { background: #f1f5f9; color: var(--text-main); }
        .btn-icon.delete-btn:hover { background: #fee2e2; color: var(--danger); }
        .btn-icon.share-btn:hover { background: #dbeafe; color: var(--primary); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 1000; padding: 20px;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background: var(--card-bg); border-radius: var(--radius); width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; padding: 24px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .close-modal { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: var(--text-muted); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .attributes-section { background: var(--bg-main); padding: 14px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 16px; }
        .attr-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }

        .images-upload-container { background: var(--bg-main); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .img-input-methods { display: flex; gap: 8px; }
        .url-input-group { display: flex; gap: 6px; flex: 1; }
        .images-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; margin-top: 8px; }
        .img-preview-thumb { position: relative; width: 100%; height: 70px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
        .img-preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .img-preview-remove { position: absolute; top: 2px; right: 2px; background: rgba(239, 68, 68, 0.9); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .public-badge { background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .public-img-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
        .public-img-gallery img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
        .public-attr-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .public-attr-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .public-attr-table tr:nth-child(even) { background: var(--bg-main); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-title">
                <i data-lucide="landmark"></i>
                <div>
                    <h1>Gestor de Património</h1>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Painel de Gestão e Consulta</p>
                </div>
            </div>
            <div class="actions">
                <button id="btn-login" class="btn btn-primary" onclick="loginGoogle()">
                    <i data-lucide="log-in" style="width: 18px;"></i> Entrar
                </button>
                <button id="btn-logout" class="btn btn-outline" onclick="logoutGoogle()" style="display: none;">
                    <i data-lucide="log-out" style="width: 18px;"></i> Sair
                </button>
                <button class="btn btn-primary" onclick="openModal()">
                    <i data-lucide="plus" style="width: 18px;"></i> Novo Item
                </button>
            </div>
        </header>

        <div class="presets-bar">
            <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Categorias:</span>
            <div class="preset-buttons" id="categoryFilters">
                <button class="preset-chip active" onclick="filterCategory('all')">Todos</button>
                <button class="preset-chip" onclick="filterCategory('Imóveis Urbanos')"><i data-lucide="building" style="width: 14px;"></i> Urbanos</button>
                <button class="preset-chip" onclick="filterCategory('Imóveis Rústicos')"><i data-lucide="trees" style="width: 14px;"></i> Rústicos</button>
                <button class="preset-chip" onclick="filterCategory('Automóveis')"><i data-lucide="car" style="width: 14px;"></i> Automóveis</button>
                <button class="preset-chip" onclick="filterCategory('Ativos financeiros')"><i data-lucide="trending-up" style="width: 14px;"></i> Finanças</button>
                <button class="preset-chip" onclick="filterCategory('Outros')"><i data-lucide="box" style="width: 14px;"></i> Outros</button>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar património..." oninput="renderItems()">
            </div>
        </div>

        <div class="content-grid" id="catalogGrid"></div>
    </div>

    <!-- Modal Form (Criar/Editar) -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Adicionar Item</h2>
                <button class="close-modal" type="button" onclick="closeModal()">&times;</button>
            </div>
            <form id="itemForm" onsubmit="saveItem(event)">
                <input type="hidden" id="itemId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="itemTitle">Título *</label>
                        <input type="text" id="itemTitle" required placeholder="Ex: T2 Lisboa / Ações Apple">
                    </div>
                    <div class="form-group">
                        <label for="itemCategory">Categoria *</label>
                        <select id="itemCategory" required>
                            <option value="Imóveis Urbanos">Imóveis Urbanos</option>
                            <option value="Imóveis Rústicos">Imóveis Rústicos</option>
                            <option value="Automóveis">Automóveis</option>
                            <option value="Ativos financeiros">Ativos financeiros</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                </div>

                <div class="form-row-3">
                    <div class="form-group">
                        <label for="itemPrice">Preço (€) *</label>
                        <input type="number" step="0.01" id="itemPrice" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="itemQuantity">Qtd. *</label>
                        <input type="number" step="1" min="1" id="itemQuantity" value="1" required>
                    </div>
                    <div class="form-group">
                        <label for="itemLiquidity">Liquidez *</label>
                        <select id="itemLiquidity" required>
                            <option value="Alta">Alta</option>
                            <option value="Média">Média</option>
                            <option value="Baixa">Baixa</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Fotos</label>
                    <div class="images-upload-container">
                        <div class="img-input-methods">
                            <input type="file" id="itemLocalImages" accept="image/*" multiple onchange="handleMultipleFiles(event)" style="display:none;">
                            <button type="button" class="btn btn-outline" onclick="document.getElementById('itemLocalImages').click()">+ Ficheiro</button>
                            <div class="url-input-group">
                                <input type="url" id="itemImageUrlInput" placeholder="URL da imagem">
                                <button type="button" class="btn btn-outline" onclick="addUrlImage()">+ URL</button>
                            </div>
                        </div>
                        <div class="images-preview-grid" id="imagesPreviewContainer"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="itemDescription">Descrição</label>
                    <textarea id="itemDescription" rows="2"></textarea>
                </div>

                <div class="attributes-section">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <label style="margin:0;">Campos Adicionais</label>
                        <button type="button" class="btn btn-outline" style="padding: 2px 8px; font-size: 0.75rem;" onclick="addAttrRow()">+ Campo</button>
                    </div>
                    <div id="attributesContainer"></div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveSubmit">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Consulta Exclusiva -->
    <div class="modal-overlay" id="publicViewModal">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <span class="public-badge"><i data-lucide="eye" style="width: 14px;"></i> Modo de Consulta</span>
                    <h2 id="publicTitle" style="margin-top: 6px;">Visualizar Item</h2>
                </div>
                <button class="close-modal" type="button" onclick="closePublicModal()">&times;</button>
            </div>
            <div id="publicModalBody"></div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button type="button" class="btn btn-outline" onclick="closePublicModal()">Fechar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, doc, setDoc, deleteDoc, getDoc, onSnapshot, collection 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZJLq_lahgFfIdUZM1ieVumLsP50taeZo",
            authDomain: "meu-inventario-5b10b.firebaseapp.com",
            projectId: "meu-inventario-5b10b",
            storageBucket: "meu-inventario-5b10b.firebasestorage.app",
            messagingSenderId: "531832101508",
            appId: "1:531832101508:web:a6b619931d3fbf530980d1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let catalog = [];
        let currentUser = null;
        let unsubscribeListener = null;
        let selectedCategory = 'all';
        let currentModalImages = [];
        let cardImageIndexes = {};

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            checkSharedLink();
        });

        async function checkSharedLink() {
            const urlParams = new URLSearchParams(window.location.search);
            const sharedUser = urlParams.get('u');
            const sharedItem = urlParams.get('item');

            if (sharedUser && sharedItem) {
                try {
                    const docRef = doc(db, "usuarios", sharedUser, "itens", sharedItem);
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        openPublicViewModal(docSnap.data());
                    } else {
                        alert("O item partilhado não foi encontrado.");
                    }
                } catch (err) {
                    console.error("Erro ao carregar link partilhado:", err);
                    alert("Erro ao carregar item. Verifique se publicou as Firebase Rules.");
                }
            }
        }

        window.shareItem = function(itemId) {
            if (!currentUser) return;
            const shareUrl = `${window.location.origin}${window.location.pathname}?u=${currentUser.uid}&item=${itemId}`;
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert("Link de consulta copiado para a área de transferência!");
            }).catch(() => {
                prompt("Copie o link de consulta:", shareUrl);
            });
        };

        window.openPublicViewModal = function(item) {
            const modal = document.getElementById('publicViewModal');
            document.getElementById('publicTitle').textContent = item.title;

            let imgs = item.images || (item.image ? [item.image] : []);
            const galleryHtml = imgs.length > 0 
                ? `<div class="public-img-gallery">${imgs.map(src => `<img src="${escapeHtml(src)}">`).join('')}</div>` 
                : '';

            const attrsHtml = Object.entries(item.attrs || {}).map(([k, v]) => `
                <tr>
                    <td style="font-weight:600; color:var(--text-muted); width:40%;">${escapeHtml(k)}</td>
                    <td>${escapeHtml(v)}</td>
                </tr>
            `).join('');

            const totalPrice = (parseFloat(item.price) || 0) * (parseInt(item.quantity) || 1);

            document.getElementById('publicModalBody').innerHTML = `
                ${galleryHtml}
                <div style="margin-bottom: 16px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span style="font-size:0.8rem; text-transform:uppercase; font-weight:700; color:var(--primary);">${escapeHtml(item.category)}</span>
                        <span class="badge-liq ${item.liquidity === 'Alta' ? 'liq-alta' : item.liquidity === 'Média' ? 'liq-media' : 'liq-baixa'}">Liquidez ${escapeHtml(item.liquidity || 'Média')}</span>
                    </div>
                    <p style="font-size:1.4rem; font-weight:700; color:var(--accent-green);">€ ${totalPrice.toLocaleString('pt-PT', {minimumFractionDigits: 2})}</p>
                </div>
                ${item.description ? `<p style="margin-bottom:16px; font-size:0.95rem;">${escapeHtml(item.description)}</p>` : ''}
                ${attrsHtml ? `<table class="public-attr-table">${attrsHtml}</table>` : ''}
            `;

            modal.classList.add('active');
            if (typeof lucide !== 'undefined') lucide.createIcons();
        };

        window.closePublicModal = function() {
            document.getElementById('publicViewModal').classList.remove('active');
            window.history.replaceState({}, document.title, window.location.pathname);
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const btnLogin = document.getElementById('btn-login');
            const btnLogout = document.getElementById('btn-logout');

            if (user) {
                if (btnLogin) btnLogin.style.display = 'none';
                if (btnLogout) btnLogout.style.display = 'inline-flex';

                const userItemsRef = collection(db, "usuarios", user.uid, "itens");
                if (unsubscribeListener) unsubscribeListener();

                unsubscribeListener = onSnapshot(userItemsRef, (snapshot) => {
                    catalog = snapshot.docs.map(doc => doc.data());
                    renderItems();
                }, (error) => {
                    console.error("Erro no Firestore:", error);
                    alert("Erro de acesso ao Firebase. Verifique se atualizou as Firebase Security Rules.");
                });
            } else {
                if (btnLogin) btnLogin.style.display = 'inline-flex';
                if (btnLogout) btnLogout.style.display = 'none';
                catalog = [];
                if (unsubscribeListener) unsubscribeListener();
                renderItems();
            }
        });

        window.loginGoogle = async () => {
            try {
                await setPersistence(auth, browserLocalPersistence);
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
            } catch (err) { alert("Erro ao entrar: " + err.message); }
        };

        window.logoutGoogle = () => signOut(auth);

        window.filterCategory = function(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.preset-chip').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(cat) || (cat === 'all' && btn.textContent.includes('Todos')));
            });
            renderItems();
        };

        window.renderItems = function() {
            const grid = document.getElementById('catalogGrid');
            if (!grid) return;
            const search = document.getElementById('searchInput').value.toLowerCase();

            if (!currentUser) {
                grid.innerHTML = `<div class="empty-state"><h3>Sessão não iniciada</h3><p>Inicie sessão para gerir o seu património ou utilize um link de partilha para consultar um item.</p></div>`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            const filtered = catalog.filter(item => {
                const matchesCat = selectedCategory === 'all' || item.category === selectedCategory;
                const matchesSearch = item.title.toLowerCase().includes(search) || item.category.toLowerCase().includes(search);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state"><h3>Sem itens</h3><p>Nenhum registo encontrado nesta vista.</p></div>`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            grid.innerHTML = filtered.map(item => {
                let itemImages = item.images || (item.image ? [item.image] : []);
                const currentImgIdx = cardImageIndexes[item.id] || 0;
                const imgUrl = itemImages[currentImgIdx] || 'https://via.placeholder.com/400x300?text=Sem+Imagem';
                const totalPrice = (parseFloat(item.price) || 0) * (parseInt(item.quantity) || 1);
                const safeId = String(item.id).replace(/'/g, "\\'");

                return `
                    <div class="item-card">
                        <div class="card-img-container">
                            ${itemImages.length > 1 ? `
                                <button class="card-img-nav card-img-prev" onclick="navigateCardImage('${safeId}', -1, event)">&lt;</button>
                                <button class="card-img-nav card-img-next" onclick="navigateCardImage('${safeId}', 1, event)">&gt;</button>
                                <span class="img-counter-badge">${currentImgIdx + 1}/${itemImages.length}</span>
                            ` : ''}
                            <img src="${escapeHtml(imgUrl)}" class="card-img" onerror="this.src='https://via.placeholder.com/400x300?text=Sem+Imagem'">
                        </div>
                        <div class="card-body">
                            <div class="card-header-meta">
                                <span class="card-category">${escapeHtml(item.category)}</span>
                                <span class="badge-liq ${item.liquidity === 'Alta' ? 'liq-alta' : item.liquidity === 'Média' ? 'liq-media' : 'liq-baixa'}">${escapeHtml(item.liquidity || 'Média')}</span>
                            </div>
                            <h3 class="card-title">${escapeHtml(item.title)}</h3>
                            <div class="card-details"><p><span>Qtd:</span> <strong>${item.quantity || 1}</strong></p></div>
                            <div class="card-footer">
                                <span class="card-price">€ ${totalPrice.toLocaleString('pt-PT', {minimumFractionDigits: 2})}</span>
                                <div class="card-actions">
                                    <button class="btn-icon share-btn" title="Partilhar Link" onclick="shareItem('${safeId}')"><i data-lucide="share-2" style="width: 16px;"></i></button>
                                    <button class="btn-icon" title="Editar" onclick="editItem('${safeId}')"><i data-lucide="edit-2" style="width: 16px;"></i></button>
                                    <button class="btn-icon delete-btn" title="Eliminar" onclick="deleteItem('${safeId}')"><i data-lucide="trash-2" style="width: 16px;"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (typeof lucide !== 'undefined') lucide.createIcons();
        };

        window.navigateCardImage = function(itemId, dir, event) {
            event.stopPropagation();
            const item = catalog.find(i => String(i.id) === String(itemId));
            let imgs = item.images || (item.image ? [item.image] : []);
            let idx = (cardImageIndexes[itemId] || 0) + dir;
            if (idx < 0) idx = imgs.length - 1;
            if (idx >= imgs.length) idx = 0;
            cardImageIndexes[itemId] = idx;
            renderItems();
        };

        window.openModal = function(editId = null) {
            const modal = document.getElementById('itemModal');
            document.getElementById('itemForm').reset();
            document.getElementById('attributesContainer').innerHTML = '';
            currentModalImages = [];

            if (editId) {
                const item = catalog.find(i => String(i.id) === String(editId));
                if (item) {
                    document.getElementById('modalTitle').textContent = 'Editar Item';
                    document.getElementById('itemId').value = item.id;
                    document.getElementById('itemTitle').value = item.title;
                    document.getElementById('itemCategory').value = item.category;
                    document.getElementById('itemPrice').value = item.price || '';
                    document.getElementById('itemQuantity').value = item.quantity || 1;
                    document.getElementById('itemLiquidity').value = item.liquidity || 'Média';
                    document.getElementById('itemDescription').value = item.description || '';
                    currentModalImages = item.images ? [...item.images] : (item.image ? [item.image] : []);
                    Object.entries(item.attrs || {}).forEach(([k, v]) => addAttrRow(k, v));
                }
            } else {
                document.getElementById('modalTitle').textContent = 'Novo Item';
                document.getElementById('itemId').value = '';
            }
            renderImagesPreview();
            modal.classList.add('active');
        };

        window.closeModal = function() { document.getElementById('itemModal').classList.remove('active'); };

        window.addUrlImage = function() {
            const input = document.getElementById('itemImageUrlInput');
            if (input && input.value.trim()) {
                currentModalImages.push(input.value.trim());
                input.value = '';
                renderImagesPreview();
            }
        };

        window.handleMultipleFiles = function(event) {
            const files = event.target.files;
            if (!files) return;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    currentModalImages.push(e.target.result);
                    renderImagesPreview();
                };
                reader.readAsDataURL(file);
            }
        };

        window.renderImagesPreview = function() {
            const container = document.getElementById('imagesPreviewContainer');
            if (!container) return;
            container.innerHTML = currentModalImages.map((src, idx) => `
                <div class="img-preview-thumb">
                    <img src="${escapeHtml(src)}">
                    <button type="button" class="img-preview-remove" onclick="removeImage(${idx})">&times;</button>
                </div>
            `).join('');
        };

        window.removeImage = function(idx) {
            currentModalImages.splice(idx, 1);
            renderImagesPreview();
        };

        window.addAttrRow = function(k = '', v = '') {
            const container = document.getElementById('attributesContainer');
            const row = document.createElement('div');
            row.className = 'attr-row';
            row.innerHTML = `
                <input type="text" placeholder="Campo" class="attr-key" value="${escapeHtml(k)}">
                <input type="text" placeholder="Valor" class="attr-value" value="${escapeHtml(v)}">
                <button type="button" class="btn-icon delete-btn" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(row);
        };

        window.saveItem = async function(e) {
            e.preventDefault();
            if (!currentUser) return alert("Precisa de iniciar sessão primeiro!");

            const id = document.getElementById('itemId').value || Date.now().toString();
            const itemData = {
                id,
                title: document.getElementById('itemTitle').value,
                category: document.getElementById('itemCategory').value,
                price: parseFloat(document.getElementById('itemPrice').value) || 0,
                quantity: parseInt(document.getElementById('itemQuantity').value) || 1,
                liquidity: document.getElementById('itemLiquidity').value,
                description: document.getElementById('itemDescription').value,
                images: [...currentModalImages],
                image: currentModalImages[0] || '',
                attrs: {}
            };

            const keys = document.querySelectorAll('.attr-key');
            const vals = document.querySelectorAll('.attr-value');
            keys.forEach((k, i) => { if (k.value.trim()) itemData.attrs[k.value.trim()] = vals[i].value.trim(); });

            try {
                await setDoc(doc(db, "usuarios", currentUser.uid, "itens", String(id)), itemData);
                closeModal();
            } catch (err) {
                alert("Erro ao guardar item: " + err.message);
            }
        };

        window.editItem = function(id) { openModal(id); };
        window.deleteItem = async function(id) {
            if (currentUser && confirm('Eliminar este item?')) {
                await deleteDoc(doc(db, "usuarios", currentUser.uid, "itens", String(id)));
            }
        };

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
    </script>
</body>
</html>
