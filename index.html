<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Catálogos Multiuso — Firebase</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent-green: #10b981;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
            padding: 24px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px 28px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-title i {
            color: var(--primary);
            width: 32px;
            height: 32px;
        }

        .logo-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-success { background-color: var(--accent-green); color: white; }
        .btn-success:hover { background-color: #059669; }

        .btn-outline { background-color: transparent; border-color: var(--border); color: var(--text-main); }
        .btn-outline:hover { background-color: #f1f5f9; }

        /* Presets Bar */
        .presets-bar {
            background: var(--card-bg);
            padding: 16px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .preset-buttons { display: flex; gap: 8px; flex-wrap: wrap; }

        .preset-chip {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg-main);
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .preset-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Controls */
        .controls { display: flex; gap: 16px; margin-bottom: 24px; align-items: center; }

        .search-box { position: relative; flex: 1; }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 42px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            outline: none;
            background: var(--card-bg);
        }

        /* Content Layout */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-img-container {
            height: 180px;
            width: 100%;
            background-color: #f1f5f9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .card-category { font-size: 0.75rem; text-transform: uppercase; color: var(--primary); font-weight: 700; margin-bottom: 4px; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
        .card-details { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; flex: 1; }
        .card-details p { margin-bottom: 4px; display: flex; justify-content: space-between; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border); }
        .card-price { font-size: 1.1rem; font-weight: 700; color: var(--accent-green); }
        .card-actions { display: flex; gap: 6px; }

        .btn-icon {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover { background: #f1f5f9; color: var(--text-main); }
        .btn-icon.delete-btn:hover { background: #fee2e2; color: var(--danger); border-color: #fecaca; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1000;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            width: 90%; max-width: 600px; max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .close-modal { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .attributes-section { background: var(--bg-main); padding: 16px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 16px; }
        .attr-row { display: flex; gap: 10px; margin-bottom: 8px; }
        .attr-row input { flex: 1; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
        #fileInput { display: none; }

        /* Image Mode Selection */
        .img-input-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .img-mode-tabs {
            display: flex;
            gap: 10px;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
        .img-mode-tab {
            cursor: pointer;
            color: var(--primary);
            text-decoration: underline;
        }
        .img-preview {
            max-height: 80px;
            border-radius: 6px;
            object-fit: cover;
            display: none;
            margin-top: 6px;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-title">
                <i data-lucide="layers"></i>
                <div>
                    <h1>Catálogo Universal</h1>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">Móveis, Moedas, Máquinas, Terrenos e Mais</p>
                </div>
            </div>
            <div class="actions">
                <button id="btn-login" class="btn btn-primary" onclick="loginGoogle()">
                    <i data-lucide="log-in"></i> Entrar com Google
                </button>
                <button id="btn-logout" class="btn btn-outline" onclick="logoutGoogle()" style="display: none;">
                    <i data-lucide="log-out"></i> Sair
                </button>
                <button class="btn btn-outline" onclick="triggerImport()">
                    <i data-lucide="upload"></i> Importar XML
                </button>
                <button class="btn btn-outline" onclick="exportXML()">
                    <i data-lucide="download"></i> Exportar XML
                </button>
                <button class="btn btn-success" onclick="exportCSV()">
                    <i data-lucide="file-spreadsheet"></i> Exportar CSV
                </button>
                <button class="btn btn-primary" onclick="openModal()">
                    <i data-lucide="plus"></i> Novo Item
                </button>
                <input type="file" id="fileInput" accept=".xml" onchange="importXML(event)">
            </div>
        </header>

        <div class="presets-bar">
            <span style="font-size: 0.9rem; font-weight: 600; color: var(--text-muted);">Filtrar por Categoria:</span>
            <div class="preset-buttons" id="categoryFilters">
                <button class="preset-chip active" onclick="filterCategory('all')">Todos</button>
                <button class="preset-chip" onclick="filterCategory('Móveis')"><i data-lucide="armchair"></i> Móveis</button>
                <button class="preset-chip" onclick="filterCategory('Moedas')"><i data-lucide="coins"></i> Moedas</button>
                <button class="preset-chip" onclick="filterCategory('Máquinas')"><i data-lucide="cog"></i> Máquinas</button>
                <button class="preset-chip" onclick="filterCategory('Terrenos')"><i data-lucide="map-pin"></i> Terrenos</button>
                <button class="preset-chip" onclick="filterCategory('Outros')">Outros</button>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar por título, categoria ou atributos..." oninput="renderItems()">
            </div>
        </div>

        <div class="content-grid" id="catalogGrid"></div>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Adicionar Item ao Catálogo</h2>
                <button class="close-modal" type="button" onclick="closeModal()">&times;</button>
            </div>
            <form id="itemForm" onsubmit="saveItem(event)">
                <input type="hidden" id="itemId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="itemTitle">Título / Nome *</label>
                        <input type="text" id="itemTitle" required placeholder="Ex: Cadeira Ergonómica">
                    </div>
                    <div class="form-group">
                        <label for="itemCategory">Categoria *</label>
                        <select id="itemCategory" onchange="handleCategoryChange()" required>
                            <option value="Móveis">Móveis</option>
                            <option value="Moedas">Moedas / Numismática</option>
                            <option value="Máquinas">Máquinas / Equipamentos</option>
                            <option value="Terrenos">Terrenos / Imóveis</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="itemPrice">Preço / Valor estim. (€)</label>
                        <input type="number" step="0.01" id="itemPrice" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Imagem do Item</label>
                        <div class="img-input-container">
                            <div class="img-mode-tabs">
                                <span class="img-mode-tab" onclick="switchImgMode('file')">Ficheiro do PC</span> | 
                                <span class="img-mode-tab" onclick="switchImgMode('url')">URL da Web</span>
                            </div>
                            <input type="file" id="itemLocalImage" accept="image/*" onchange="previewLocalImage(event)" style="display: block;">
                            <input type="url" id="itemImageUrl" placeholder="https://exemplo.com/imagem.jpg" style="display: none;" oninput="previewUrlImage()">
                            <img id="imagePreview" class="img-preview" alt="Pré-visualização">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="itemDescription">Descrição</label>
                    <textarea id="itemDescription" rows="3" placeholder="Detalhes gerais do item..."></textarea>
                </div>

                <div class="attributes-section">
                    <h4 style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        Atributos Específicos
                        <button type="button" class="btn btn-outline" style="padding: 2px 8px; font-size: 0.75rem;" onclick="addAttrRow()">+ Adicionar Campo</button>
                    </h4>
                    <div id="attributesContainer"></div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveSubmit">Salvar Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Integração com Firebase v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            deleteDoc, 
            onSnapshot, 
            collection 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAZJLq_lahgFfIdUZM1ieVumLsP50taeZo",
            authDomain: "meu-inventario-5b10b.firebaseapp.com",
            projectId: "meu-inventario-5b10b",
            storageBucket: "meu-inventario-5b10b.firebasestorage.app",
            messagingSenderId: "531832101508",
            appId: "1:531832101508:web:a6b619931d3fbf530980d1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let catalog = [];
        let currentUser = null;
        let unsubscribeListener = null;

        let selectedCategory = 'all';
        let currentImageBase64 = '';

        const categoryPresets = {
            'Móveis': ['Material', 'Cor', 'Dimensões'],
            'Moedas': ['Ano', 'Metal', 'Estado Conservação'],
            'Máquinas': ['Potência', 'Voltagem', 'Ano Fabrico'],
            'Terrenos': ['Área Total', 'Área Construção', 'Localização'],
            'Outros': ['Estado', 'Origem']
        };

        // Função para comprimir imagens locais antes de salvar
        function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        // Monitor de Autenticação do Firebase
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const btnLogin = document.getElementById('btn-login');
            const btnLogout = document.getElementById('btn-logout');

            if (user) {
                if (btnLogin) btnLogin.style.display = 'none';
                if (btnLogout) btnLogout.style.display = 'inline-flex';

                const userItemsRef = collection(db, "usuarios", user.uid, "itens");
                if (unsubscribeListener) unsubscribeListener();

                unsubscribeListener = onSnapshot(userItemsRef, (snapshot) => {
                    catalog = snapshot.docs.map(doc => doc.data());
                    renderItems();
                }, (err) => {
                    console.error("Erro na leitura do Firestore:", err);
                });
            } else {
                if (btnLogin) btnLogin.style.display = 'inline-flex';
                if (btnLogout) btnLogout.style.display = 'none';
                catalog = [];
                if (unsubscribeListener) unsubscribeListener();
                renderItems();
            }
        });

        // Window Exports para compatibilidade com handlers inline do HTML
        window.loginGoogle = async () => {
            try {
                await setPersistence(auth, browserLocalPersistence);
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                await signInWithPopup(auth, provider);
            } catch (err) {
                alert("Erro ao iniciar sessão com o Google: " + err.message);
            }
        };

        window.logoutGoogle = () => signOut(auth);

        window.filterCategory = function(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.preset-chip').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(cat) || (cat === 'all' && btn.textContent.includes('Todos')));
            });
            renderItems();
        };

        window.renderItems = function() {
            const grid = document.getElementById('catalogGrid');
            if (!grid) return;

            const searchInput = document.getElementById('searchInput');
            const search = searchInput ? searchInput.value.toLowerCase() : '';

            if (!currentUser) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>Sessão não iniciada</h3>
                        <p>Inicie sessão com a sua conta do Google para carregar e gerir os seus itens na nuvem.</p>
                    </div>
                `;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            const filtered = catalog.filter(item => {
                const matchesCat = selectedCategory === 'all' || item.category === selectedCategory;
                const matchesSearch = (item.title && item.title.toLowerCase().includes(search)) ||
                                      (item.category && item.category.toLowerCase().includes(search)) ||
                                      (item.description && item.description.toLowerCase().includes(search)) ||
                                      Object.entries(item.attrs || {}).some(([k, v]) => 
                                          k.toLowerCase().includes(search) || String(v).toLowerCase().includes(search)
                                      );
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>Nenhum item encontrado</h3>
                        <p>Tente ajustar a sua pesquisa ou adicione novos itens ao seu catálogo.</p>
                    </div>
                `;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const imgUrl = item.image || 'https://via.placeholder.com/400x300?text=Sem+Imagem';
                const attrsHtml = Object.entries(item.attrs || {})
                    .slice(0, 3)
                    .map(([key, val]) => `<p><span>${escapeHtml(key)}:</span> <strong>${escapeHtml(val)}</strong></p>`)
                    .join('');

                const safeId = String(item.id).replace(/'/g, "\\'");

                return `
                    <div class="item-card">
                        <div class="card-img-container">
                            <img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(item.title)}" class="card-img" onerror="this.src='https://via.placeholder.com/400x300?text=Sem+Imagem'">
                        </div>
                        <div class="card-body">
                            <span class="card-category">${escapeHtml(item.category)}</span>
                            <h3 class="card-title">${escapeHtml(item.title)}</h3>
                            <div class="card-details">${attrsHtml}</div>
                            <div class="card-footer">
                                <span class="card-price">${item.price ? '€ ' + Number(item.price).toLocaleString('pt-PT', {minimumFractionDigits: 2}) : 'Sob Consulta'}</span>
                                <div class="card-actions">
                                    <button class="btn-icon" type="button" onclick="editItem('${safeId}')" title="Editar"><i data-lucide="edit-2"></i></button>
                                    <button class="btn-icon delete-btn" type="button" onclick="deleteItem('${safeId}')" title="Eliminar"><i data-lucide="trash-2"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (typeof lucide !== 'undefined') lucide.createIcons();
        };

        window.switchImgMode = function(mode) {
            const fileInput = document.getElementById('itemLocalImage');
            const urlInput = document.getElementById('itemImageUrl');
            if (mode === 'file') {
                fileInput.style.display = 'block';
                urlInput.style.display = 'none';
                urlInput.value = '';
            } else {
                fileInput.style.display = 'none';
                urlInput.style.display = 'block';
                fileInput.value = '';
                currentImageBase64 = '';
            }
            updateImagePreview();
        };

        window.previewLocalImage = async function(event) {
            const file = event.target.files[0];
            if (file) {
                try {
                    currentImageBase64 = await compressImage(file);
                    updateImagePreview(currentImageBase64);
                } catch(err) {
                    console.error("Erro ao comprimir imagem:", err);
                    alert("Erro ao ler o ficheiro de imagem.");
                }
            } else {
                currentImageBase64 = '';
                updateImagePreview();
            }
        };

        window.previewUrlImage = function() {
            const url = document.getElementById('itemImageUrl').value;
            updateImagePreview(url);
        };

        function updateImagePreview(src = '') {
            const preview = document.getElementById('imagePreview');
            if (src) {
                preview.src = src;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
        }

        window.openModal = function(editId = null) {
            const modal = document.getElementById('itemModal');
            const form = document.getElementById('itemForm');
            form.reset();
            document.getElementById('attributesContainer').innerHTML = '';
            currentImageBase64 = '';
            switchImgMode('file');

            if (editId) {
                const item = catalog.find(i => String(i.id) === String(editId));
                if (item) {
                    document.getElementById('modalTitle').textContent = 'Editar Item';
                    document.getElementById('itemId').value = item.id;
                    document.getElementById('itemTitle').value = item.title;
                    document.getElementById('itemCategory').value = item.category;
                    document.getElementById('itemPrice').value = item.price || '';
                    document.getElementById('itemDescription').value = item.description || '';

                    if (item.image && item.image.startsWith('data:image')) {
                        currentImageBase64 = item.image;
                        switchImgMode('file');
                        updateImagePreview(item.image);
                    } else if (item.image) {
                        switchImgMode('url');
                        document.getElementById('itemImageUrl').value = item.image;
                        updateImagePreview(item.image);
                    }

                    Object.entries(item.attrs || {}).forEach(([k, v]) => addAttrRow(k, v));
                }
            } else {
                document.getElementById('modalTitle').textContent = 'Adicionar Item ao Catálogo';
                document.getElementById('itemId').value = '';
                handleCategoryChange();
            }

            modal.classList.add('active');
        };

        window.closeModal = function() {
            document.getElementById('itemModal').classList.remove('active');
        };

        window.handleCategoryChange = function() {
            if (!document.getElementById('itemId').value) {
                const cat = document.getElementById('itemCategory').value;
                const container = document.getElementById('attributesContainer');
                container.innerHTML = '';
                (categoryPresets[cat] || []).forEach(attrName => addAttrRow(attrName, ''));
            }
        };

        window.addAttrRow = function(key = '', val = '') {
            const container = document.getElementById('attributesContainer');
            const row = document.createElement('div');
            row.className = 'attr-row';
            row.innerHTML = `
                <input type="text" placeholder="Atributo (ex: Cor)" class="attr-key" value="${escapeHtml(key)}">
                <input type="text" placeholder="Valor (ex: Azul)" class="attr-value" value="${escapeHtml(val)}">
                <button type="button" class="btn-icon delete-btn" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(row);
        };

        window.saveItem = async function(e) {
            e.preventDefault();
            if (!currentUser) {
                alert("Sessão não detetada. Por favor, volte a iniciar sessão com a sua conta Google.");
                return;
            }

            const btnSave = document.getElementById('btnSaveSubmit');
            btnSave.disabled = true;
            btnSave.textContent = 'A guardar...';

            try {
                const id = document.getElementById('itemId').value || Date.now().toString();
                const title = document.getElementById('itemTitle').value;
                const category = document.getElementById('itemCategory').value;
                const price = parseFloat(document.getElementById('itemPrice').value) || 0;
                const description = document.getElementById('itemDescription').value || '';

                let image = currentImageBase64 || document.getElementById('itemImageUrl').value || '';

                const attrs = {};
                const keys = document.querySelectorAll('.attr-key');
                const vals = document.querySelectorAll('.attr-value');
                keys.forEach((kInput, index) => {
                    const k = kInput.value.trim();
                    const v = vals[index].value.trim();
                    if (k) attrs[k] = v;
                });

                const newItem = { id, title, category, price, image, description, attrs };

                // Grava no Firestore
                const docRef = doc(db, "usuarios", currentUser.uid, "itens", String(id));
                await setDoc(docRef, newItem);

                // RESET DOS FILTROS para garantir que o item aparece no ecrã!
                selectedCategory = 'all';
                const searchInput = document.getElementById('searchInput');
                if (searchInput) searchInput.value = '';
                
                document.querySelectorAll('.preset-chip').forEach(btn => {
                    btn.classList.toggle('active', btn.textContent.includes('Todos'));
                });

                // Atualização instantânea da interface
                const existingIdx = catalog.findIndex(i => String(i.id) === String(id));
                if (existingIdx >= 0) {
                    catalog[existingIdx] = newItem;
                } else {
                    catalog.push(newItem);
                }
                
                renderItems();
                closeModal();
            } catch (err) {
                console.error("Erro ao guardar no Firestore:", err);
                alert("Erro ao guardar item no Firebase: " + err.message);
            } finally {
                btnSave.disabled = false;
                btnSave.textContent = 'Salvar Item';
            }
        };

        window.editItem = function(id) { openModal(id); };

        window.deleteItem = async function(id) {
            if (!currentUser) return;
            if (confirm('Tem a certeza que pretende eliminar este item?')) {
                try {
                    const docRef = doc(db, "usuarios", currentUser.uid, "itens", String(id));
                    await deleteDoc(docRef);
                } catch (err) {
                    alert("Erro ao eliminar o item: " + err.message);
                }
            }
        };

        window.exportXML = function() {
            let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<catalogo>\n';
            catalog.forEach(item => {
                xml += '  <item>\n';
                xml += `    <id>${escapeXml(item.id)}</id>\n`;
                xml += `    <titulo>${escapeXml(item.title)}</titulo>\n`;
                xml += `    <categoria>${escapeXml(item.category)}</categoria>\n`;
                xml += `    <preco>${item.price}</preco>\n`;
                xml += `    <imagem>${escapeXml(item.image)}</imagem>\n`;
                xml += `    <descricao>${escapeXml(item.description)}</descricao>\n`;
                xml += '    <atributos>\n';
                Object.entries(item.attrs || {}).forEach(([k, v]) => {
                    xml += `      <atributo nome="${escapeXml(k)}">${escapeXml(v)}</atributo>\n`;
                });
                xml += '    </atributos>\n';
                xml += '  </item>\n';
            });
            xml += '</catalogo>';

            downloadFile(xml, 'catalogo.xml', 'application/xml');
        };

        window.exportCSV = function() {
            const allAttrKeys = new Set();
            catalog.forEach(item => Object.keys(item.attrs || {}).forEach(k => allAttrKeys.add(k)));
            const attrKeysArr = Array.from(allAttrKeys);

            let headers = ['ID', 'Título', 'Categoria', 'Preço', 'Imagem', 'Descrição', ...attrKeysArr];
            let csvRows = [];
            csvRows.push(headers.map(h => `"${h.replace(/"/g, '""')}"`).join(';'));

            catalog.forEach(item => {
                let row = [
                    item.id,
                    item.title,
                    item.category,
                    item.price,
                    item.image,
                    item.description,
                    ...attrKeysArr.map(k => (item.attrs && item.attrs[k]) ? item.attrs[k] : '')
                ];
                csvRows.push(row.map(val => `"${String(val || '').replace(/"/g, '""')}"`).join(';'));
            });

            const csvContent = '\uFEFF' + csvRows.join('\n');
            downloadFile(csvContent, 'catalogo.csv', 'text/csv;charset=utf-8;');
        };

        window.triggerImport = function() { document.getElementById('fileInput').click(); };

        window.importXML = function(event) {
            if (!currentUser) {
                alert("Entre com a sua conta do Google para poder importar o ficheiro diretamente para a nuvem.");
                return;
            }

            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(e.target.result, "text/xml");
                    const items = xmlDoc.getElementsByTagName("item");

                    for (let i = 0; i < items.length; i++) {
                        const el = items[i];
                        const id = getXmlText(el, "id") || Date.now().toString() + i;
                        const title = getXmlText(el, "titulo") || 'Sem Título';
                        const category = getXmlText(el, "categoria") || 'Outros';
                        const price = parseFloat(getXmlText(el, "preco")) || 0;
                        const image = getXmlText(el, "imagem") || '';
                        const description = getXmlText(el, "descricao") || '';

                        const attrs = {};
                        const attrNodes = el.querySelectorAll("atributo");
                        attrNodes.forEach(node => {
                            const key = node.getAttribute("nome");
                            const val = node.textContent;
                            if (key) attrs[key] = val;
                        });

                        const importedItem = { id, title, category, price, image, description, attrs };
                        const docRef = doc(db, "usuarios", currentUser.uid, "itens", String(id));
                        await setDoc(docRef, importedItem);
                    }

                    alert(`${items.length} itens importados e salvos com sucesso!`);
                } catch (err) {
                    alert('Erro ao processar e salvar o ficheiro XML.');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        };

        function getXmlText(parent, tagName) {
            const node = parent.getElementsByTagName(tagName)[0];
            return node ? node.textContent : '';
        }

        function escapeXml(str) {
            return String(str || '').replace(/[<>&'"]/g, c => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case "'": return '&apos;';
                    case '"': return '&quot;';
                }
            });
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, match => {
                const masks = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
                return masks[match];
            });
        }

        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
</body>
</html>
